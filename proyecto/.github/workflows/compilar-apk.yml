name: Crear APK Gutiérrez Radio
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar plataforma Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar aplicación
        run: gradle --no-daemon :app:assembleDebug
      - name: Guardar APK instalable
        uses: actions/upload-artifact@v4
        with:
          name: GutierrezRadio-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
